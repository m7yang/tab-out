      function fixtureRetainedPageUrl(tab) {
        const rawUrl = tab.pendingUrl || tab.url || ''
        if (!rawUrl.startsWith('chrome-extension://')) return rawUrl

        const parsed = URL.parse(rawUrl)
        if (!parsed || !parsed.pathname.endsWith('/suspended.html')) return rawUrl
        const fragment = parsed.hash.startsWith('#') ? parsed.hash.slice(1) : ''
        const markerIndex = fragment.indexOf('&uri=')
        const encodedUrl = markerIndex >= 0
          ? fragment.slice(markerIndex + '&uri='.length)
          : fragment.startsWith('uri=') ? fragment.slice('uri='.length) : ''
        if (!encodedUrl) return rawUrl
        try {
          return decodeURIComponent(encodedUrl) || rawUrl
        } catch {
          return rawUrl
        }
      }

      function fixtureTabIsRetainable(tab, runtimeId) {
        const url = fixtureRetainedPageUrl(tab)
        const parsed = URL.parse(url)
        if (!parsed) return false
        if (['blob:', 'data:', 'javascript:'].includes(parsed.protocol)) return false
        if (parsed.protocol === 'about:' && ['blank', 'srcdoc'].includes(parsed.pathname)) return false
        if (
          parsed.protocol === 'chrome:' &&
          ['newtab', 'new-tab-page'].includes(parsed.hostname)
        ) return false
        if (
          parsed.protocol === 'chrome-search:' &&
          ['local-ntp', 'new-tab-page'].includes(parsed.hostname)
        ) return false
        if (parsed.protocol === 'chrome-untrusted:' && parsed.hostname === 'new-tab-page') return false
        if (parsed.protocol === 'chrome-extension:' && parsed.hostname === runtimeId) return false
        return true
      }

      function captureFixtureRetainedPage(tab, runtimeId) {
        if (!fixtureTabIsRetainable(tab, runtimeId)) return
        const url = fixtureRetainedPageUrl(tab)

        const identityDigest = JSON.stringify([surfaceKind, url])

          surfaceKind,
          canonicalKey: url,
